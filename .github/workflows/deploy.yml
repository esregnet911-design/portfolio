name: Deploy portfolio to Tencent Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull, build, and restart PM2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Trigger Tencent Cloud deploy webhook
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SERVER_HOST}" ] || [ -z "${DEPLOY_WEBHOOK_SECRET}" ]; then
            echo "Missing required GitHub Secrets: SERVER_HOST, DEPLOY_WEBHOOK_SECRET"
            exit 1
          fi

          curl --fail-with-body --show-error --silent --location --insecure \
            --max-time 1200 \
            --request POST \
            --header "x-deploy-secret: ${DEPLOY_WEBHOOK_SECRET}" \
            "https://${SERVER_HOST}/__deploy" | tee deploy-output.log

          grep -q "DEPLOY_WEBHOOK_SUCCESS" deploy-output.log
